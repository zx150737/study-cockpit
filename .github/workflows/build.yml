name: Build & Check

# 推送 main 分支与发起 PR 时并行校验后端、前端，保证主干始终可构建。
on:
  push:
    branches: [main, codex/public-registration-deployment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B verify --no-transfer-progress

  frontend:
    name: Frontend (typecheck / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  deployment:
    name: Deployment (Docker Compose / HTTPS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate disposable configuration
        shell: bash
        run: |
          umask 077
          {
            echo 'APP_DOMAIN=localhost'
            echo 'HTTP_PORT=8088'
            echo 'HTTPS_PORT=8443'
            echo 'APP_ALLOW_REGISTER=true'
            for key in DB_PASSWORD MYSQL_ROOT_PASSWORD JWT_SECRET FILE_TOKEN_SECRET; do
              echo "$key=$(openssl rand -hex 32)"
            done
          } > .env
          docker compose config --quiet
          bash -n deploy/docker/setup.sh deploy/docker/backup.sh
      - name: Build and start production containers
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verify HTTPS and independent accounts
        run: |
          for attempt in $(seq 1 30); do
            if docker compose cp web:/data/caddy/pki/authorities/local/root.crt /tmp/cockpit-ca.crt; then break; fi
            sleep 2
          done
          SMOKE_CA_FILE=/tmp/cockpit-ca.crt SMOKE_RECREATE=true python3 deploy/docker/smoke-test.py
          bash deploy/docker/backup.sh
          if docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u cockpit study_cockpit -e "CREATE TABLE forbidden_ddl (id INT);"'; then
            echo 'Business account unexpectedly has DDL permission'
            exit 1
          fi
          docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root -e "CREATE DATABASE cockpit_restore;"'
          gzip -dc backups/study_cockpit_*.sql.gz | docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root cockpit_restore'
          docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -u root -N -e "SELECT (SELECT COUNT(*) FROM study_cockpit.sys_user)=(SELECT COUNT(*) FROM cockpit_restore.sys_user) AND (SELECT COUNT(*) FROM study_cockpit.daily_task)=(SELECT COUNT(*) FROM cockpit_restore.daily_task);"' | grep -qx 1
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop disposable services
        if: always()
        run: docker compose down
