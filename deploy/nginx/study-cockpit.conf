# ============================================================
# 学习监控驾驶舱 · Nginx 站点配置
# 放置：/etc/nginx/sites-available/study-cockpit -> sites-enabled/
# 前端 dist 与 /api 同域，后端与 MySQL 均不对公网暴露
# ============================================================

# HTTP 全量跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.example;

    # ---- HTTPS ----
    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 不泄露版本号
    server_tokens off;

    # HSTS（确认 HTTPS 稳定后再启用 includeSubDomains）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/study-cockpit/dist;
    index index.html;

    # 上传大小第一道闸门（后端 multipart 配置为第二道）
    client_max_body_size 5m;
    client_body_buffer_size 128k;

    # 图片存储目录绝不对外暴露（纵深防御；实际目录本就不在 web root）
    location ^~ /uploads {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 隐藏文件
    location ~ /\. {
        deny all;
    }

    # ---- 后端 API 反向代理 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 追加真实远端 IP；后端限流取 XFF 最后一个值，避免伪造绕过
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # CSV 导出为流式响应，关闭缓冲
        proxy_buffering off;
    }

    # ---- 前端静态资源 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长期缓存
    location ~* ^/assets/.*\.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版立即生效
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    access_log /var/log/nginx/study-cockpit.access.log;
    error_log  /var/log/nginx/study-cockpit.error.log warn;
}
