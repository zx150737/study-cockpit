name: study-cockpit

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: study_cockpit
      MYSQL_USER: cockpit
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci', '--default-time-zone=+08:00']
    volumes:
      - db-data:/var/lib/mysql
      - ./docs/sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./deploy/docker/20-permissions.sql:/docker-entrypoint-initdb.d/20-permissions.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: '8080'
      DB_URL: jdbc:mysql://db:3306/study_cockpit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: cockpit
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:?Set FILE_TOKEN_SECRET in .env}
      FILE_STORAGE_DIR: /data/study-cockpit/uploads
      APP_ALLOW_REGISTER: ${APP_ALLOW_REGISTER:-false}
      TZ: Asia/Shanghai
    volumes:
      - uploads:/data/study-cockpit/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8080/api/auth/registration']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    logging: *logging

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
